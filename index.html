<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>pixel-patterns</title>
		<link rel="icon" type="image/png" href="favicon.png">
		<link rel="stylesheet" href="style.css">
	</head>
	<body class="unselectable">
		<div id="pixel-pattern-div">
			<span>
				<input id="draw-range-width" type="range" oninput="drawPanelDimensionsChanged()" min="1" max="25" value="5" class="slider">
				<input id="draw-range-height" type="range" oninput="drawPanelDimensionsChanged()" min="1" max="25" value="5" class="slider">
				<input id="zoom-level" type="range" oninput="zoomChanged()" min="1" max="15" step="1" value="7" class="slider">
				<input id="cell-scale-type" type="checkbox" oninput="toggleInputPanelAspectRatioLock()">Stretch input
				<input id="save-state" type="checkbox" oninput="toggleShouldSaveState(this)">Save state
			</span>
			<div>
				<canvas id="drawing-panel"></canvas>
				<canvas id="display-panel"></canvas>
			</div>
			<div>
				<button type="button" onclick="clearPanel()">Clear</button>
				<span id="chosen-color-wrapper"><input id="chosen-color" type="color" value="#cc33cc" onchange="saveState()"></span>
				<input id="chosen-alpha" type="range" min="0.0" max="1.0" step="0.01" value="0.5" class="slider" oninput="updateColorDisplayOpacity()">
				<button type="button" onclick="fillPanel()">Fill</button>
			</div>
		</div>

		<!-- GitHub source link -->

		<script src="script.js"></script>
	</body>
</html>
