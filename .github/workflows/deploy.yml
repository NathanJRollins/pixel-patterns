name: Build & deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow only one concurrent deploy; don't race with in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      # Sourcemaps are built with sourcemap: 'hidden' in vite.config.ts so
      # they're available locally but never auto-fetched by the browser.
      # Strip them from the deploy artifact too, just so the Pages site
      # doesn't carry ~260 KB that no user ever requests.
      - name: Strip sourcemaps before upload
        run: find dist -name '*.map' -delete

      - name: Upload build artifact (dist/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4